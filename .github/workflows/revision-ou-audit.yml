name: Revision OU audit

on:
  push:
    branches:
      - codex/rem-revision-audit
    paths:
      - analysis/revision_audit_ou.R
      - .github/workflows/revision-ou-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install audit dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ape
            any::metadat
            any::metafor
            any::nlme

      - name: Run OU audit
        shell: bash
        run: |
          Rscript analysis/revision_audit_ou.R 2>&1 | tee ou-audit.log
          {
            echo '## OU revision audit'
            echo
            echo '~~~text'
            sed -n '/^VERSIONS/,$p' ou-audit.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit log
        uses: actions/upload-artifact@v4
        with:
          name: ou-audit-log
          path: ou-audit.log
