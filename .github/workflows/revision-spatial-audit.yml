name: Revision spatial audit

on:
  workflow_dispatch:
  push:
    branches:
      - codex/rem-revision-audit
    paths:
      - analysis/revision_audit_spatial.R
      - data/Roger_etal_2024/Roger_etal_2024.csv
      - .github/workflows/revision-spatial-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install audit dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::geosphere
            any::metafor

      - name: Run spatial audit
        run: Rscript analysis/revision_audit_spatial.R 2>&1 | tee revision-spatial-audit.log

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-spatial-audit
          path: revision-spatial-audit.log
